services:
  pipeline-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing-engine-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app
      - ./logs:/app/logs

  postgres:
    image: postgres:15-alpine
    container_name: pipeline_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: pipeline_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: